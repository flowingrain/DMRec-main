optimizer:
  name: adam
  lr: 1.0e-3
  weight_decay: 0

train:
  epoch: 1000
  batch_size: 1024
  save_model: false
  loss: pairwise
  test_step: 3
  reproducible: true
  seed: 2024
  patience: 20

test:
  metrics: [recall, ndcg]
  k: [10, 20]
  batch_size: 1024

data:
  type: general_cf

model:
  name: default

